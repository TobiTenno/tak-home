## Version 2026/11/14
# TAK Server TCP passthrough. TLS stays on tak_server (private CA).
# Not for site-confs — stream module only.
#
# SWAG dropped the stock stream include. In /config/nginx/nginx.conf add
# this outside the http{} block (sibling of http, not inside it):
#
#   stream {
#       include /config/nginx/stream-confs/*.conf;
#   }
#
# SWAG must be on Docker network "tak".
# Publish 8089, 8443, 8446, and 9473 on the SWAG service.
# Map host 8443 -> container 8443 (not 8443:443).
# Use container.network names so NextDNS search domains do not steal short hosts.

# CoT / ATAK streaming
server {
    listen 8089;
    listen [::]:8089;

    include /config/nginx/resolver.conf;
    set $upstream_app tak_server.tak;
    set $upstream_port 8089;
    proxy_pass $upstream_app:$upstream_port;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}

# Web admin / API (client cert)
server {
    listen 8443;
    listen [::]:8443;

    include /config/nginx/resolver.conf;
    set $upstream_app tak_server.tak;
    set $upstream_port 8443;
    proxy_pass $upstream_app:$upstream_port;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}

# Certificate enrollment
server {
    listen 8446;
    listen [::]:8446;

    include /config/nginx/resolver.conf;
    set $upstream_app tak_server.tak;
    set $upstream_port 8446;
    proxy_pass $upstream_app:$upstream_port;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}

# Federation v2 (not ATAK). Port 9473 frees host 9001 for other services (e.g. MQTT WS).
server {
    listen 9473;
    listen [::]:9473;

    include /config/nginx/resolver.conf;
    set $upstream_app tak_server.tak;
    set $upstream_port 9473;
    proxy_pass $upstream_app:$upstream_port;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}
