# Copy to SWAG: /config/nginx/stream-confs/tak-stream.conf
# TCP passthrough. TLS stays on tak_server. SWAG does not decrypt these.
# Publish 8089, 8443, 8446, and 9001 on the SWAG service.
# Map host 8443 to container 8443 for TAK. Do not map 8443:443; that is SWAG HTTPS.
# SWAG must be on Docker network "tak".
# tak_server sees the SWAG container as the client.
# No ssl_certificate here. The TAK private CA answers on these ports.

server {
    listen 8089;
    proxy_pass tak_server:8089;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}

server {
    listen 8443;
    proxy_pass tak_server:8443;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}

server {
    listen 8446;
    proxy_pass tak_server:8446;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}

server {
    listen 9001;
    proxy_pass tak_server:9001;
    proxy_connect_timeout 10s;
    proxy_timeout 86400s;
}
